<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính tổng hai số</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f7f6;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .input-group { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
        input {
            width: 80px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
        }
        input:focus { outline: none; border-color: #4a90e2; }
        button {
            padding: 10px 20px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover { background-color: #357abd; }
        #result-container {
            margin-top: 20px;
            font-size: 1.5em;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Tính Tổng</h2>
    <div class="input-group">
        <input type="number" id="num1" placeholder="Số thứ 1">
        <span>+</span>
        <input type="number" id="num2" placeholder="Số thứ 2">
        <span>=</span>
    </div>
    <div id="result-container">
        <span id="result">?</span>
    </div>
    <br>
    <button onclick="tinhTong()">Tính Tổng</button>
</div>
<script>
    function tinhTong() {
        // Lấy giá trị từ input
        const n1 = document.getElementById('num1').value;
        const n2 = document.getElementById('num2').value;
        const resultDisplay = document.getElementById('result');

        // Kiểm tra nếu người dùng chưa nhập số
        if (n1 === "" || n2 === "") {
            alert("Vui lòng nhập đầy đủ cả hai số!");
            return;
        }

        // Chuyển đổi sang kiểu số và tính toán
        const sum = parseFloat(n1) + parseFloat(n2);

        // Hiển thị kết quả
        resultDisplay.innerText = sum;
    }
</script>
</body>
</html>
